<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rain Chess</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
  <style>
    :root {
      --bg: #0f1728;
      --bg-2: #111b2d;
      --panel: #16233b;
      --panel-soft: #1b2a46;
      --border: rgba(144, 166, 200, 0.2);
      --board-light: #f0d9b5;
      --board-dark: #b58863;
      --text: #eaf1ff;
      --muted: #9bb0d1;
      --accent: #43d0ff;
      --accent-2: #60e0a1;
      --danger: #ff637d;
      --warning: #ffca5e;
      --shadow: rgba(0, 0, 0, 0.28);
      --square-size: min(9vw, 76px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #152544 0%, var(--bg) 35%, #090d18 100%);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 20px;
    }

    .app {
      width: min(1280px, 100%);
      min-height: 860px;
      background: rgba(14, 20, 35, 0.84);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 22px 56px var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      height: 84px;
      padding: 18px 22px;
      background: rgba(14, 22, 33, 0.9);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #43d0ff, #7a6cff);
      color: #09131f;
      box-shadow: 0 8px 20px rgba(67, 208, 255, 0.4);
    }

    .brand-mark i {
      font-size: 1.1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill,
    .button,
    .mode-btn,
    .elo-btn,
    .promo-btn {
      border: 1px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      border-radius: 12px;
      height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .pill {
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      border-style: dashed;
    }

    .button:hover,
    .mode-btn:hover,
    .elo-btn:hover,
    .promo-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(130, 177, 255, 0.5);
    }

    .promo-btn {
      background: linear-gradient(135deg, rgba(67, 208, 255, 0.18), rgba(122, 108, 255, 0.18));
      border-color: rgba(67, 208, 255, 0.38);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 0;
      min-height: 776px;
    }

    .board-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 18px 18px 20px;
      background: linear-gradient(180deg, rgba(17, 25, 38, 0.9) 0%, rgba(12, 18, 30, 0.96) 100%);
      border-right: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 10px 18px;
    }

    .mode-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mode-btn.active,
    .elo-btn.active {
      background: linear-gradient(135deg, rgba(67, 208, 255, 0.18), rgba(96, 224, 161, 0.18));
      border-color: rgba(67, 208, 255, 0.5);
      color: #dffbff;
      box-shadow: inset 0 0 0 1px rgba(67,208,255,0.08);
    }

    .board-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 8px 6px 0;
    }

    .board-wrap {
      position: relative;
      width: min(78vw, 720px);
      aspect-ratio: 1;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 18px 38px rgba(0,0,0,0.4);
      background: #d4d0c5;
    }

    #board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      background: #d4d0c5;
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      user-select: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      font-size: clamp(0.9rem, 1.6vw, 1.8rem);
      transition: transform 0.14s ease, box-shadow 0.14s ease;
      outline: none;
    }

    .square:hover {
      box-shadow: inset 0 0 0 2px rgba(13, 93, 146, 0.45);
    }

    .square.light { background: var(--board-light); }
    .square.dark { background: var(--board-dark); }
    .square.selected {
      box-shadow: inset 0 0 0 4px rgba(26, 122, 255, 0.9);
    }
    .square.movable::after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.45);
      pointer-events: none;
    }
    .square.capture::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 4px solid rgba(230, 40, 60, 0.75);
      border-radius: 50%;
      pointer-events: none;
    }
    .square.lastmove {
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.6);
    }

    .piece {
      position: relative;
      width: 68%;
      height: 68%;
      display: grid;
      place-items: center;
      border-radius: 12px;
      transition: transform 0.12s ease;
      pointer-events: none;
    }

    .piece i {
      font-size: clamp(1.8rem, 3vw, 3rem);
      line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.25));
    }

    .white-piece i { color: #f4f7fb; }
    .black-piece i { color: #192330; }
    .piece:hover { transform: scale(1.02); }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 10px 2px;
    }

    .status-pill {
      flex: 1;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 600;
      color: var(--muted);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 15px rgba(96,224,161,0.7);
    }

    .sidebar {
      background: rgba(14, 20, 35, 0.9);
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.74rem;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .score-row:last-child {
      border-bottom: none;
    }

    .player-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      background: linear-gradient(135deg, #7a6cff, #43d0ff);
      box-shadow: 0 10px 22px rgba(122,108,255,0.35);
    }

    .avatar.dark {
      background: linear-gradient(135deg, #303b51, #0d1119);
      color: #dfe9ff;
      box-shadow: 0 10px 22px rgba(16, 24, 38, 0.5);
    }

    .player-name {
      font-weight: 700;
      font-size: 0.96rem;
    }

    .player-tag {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .player-elo {
      font-weight: 800;
      font-size: 1rem;
      color: var(--warning);
    }

    .elo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .elo-btn {
      height: 42px;
      border-radius: 12px;
      padding: 0 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(255,255,255,0.02);
      justify-content: center;
    }

    .elo-btn .tier {
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .move-list {
      max-height: 290px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .move-row {
      display: grid;
      grid-template-columns: 48px 1fr 1fr;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.82rem;
      color: var(--muted);
    }

    .move-row strong {
      color: var(--text);
    }

    .move-row:last-child { border-bottom: none; }

    .room-box {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .room-code {
      flex: 1;
      height: 42px;
      border-radius: 12px;
      padding: 0 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.015);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.08em;
    }

    .board-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-btn {
      height: 36px;
      border-radius: 10px;
      padding: 0 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      cursor: pointer;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .board-panel {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .sidebar {
        padding-top: 14px;
      }
    }

    @media (max-width: 620px) {
      body { padding: 10px; }
      .topbar { padding: 12px 14px; }
      .header-actions { gap: 8px; }
      .mode-btn, .pill, .button { height: 38px; padding: 0 10px; }
      .brand { font-size: 0.72rem; letter-spacing: 0.05em; }
      .board-wrap { width: min(92vw, 560px); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i class="fa-solid fa-chess-knight"></i></div>
        <span>Rain Chess</span>
      </div>

      <div class="header-actions">
        <button class="pill" id="newGameBtn"><i class="fa-solid fa-rotate"></i> New Match</button>
        <button class="promo-btn" id="botBtn"><i class="fa-solid fa-robot"></i> Rain Bot</button>
      </div>
    </header>

    <div class="layout">
      <main class="board-panel">
        <div class="toolbar">
          <div class="mode-group" id="modeGroup">
            <button class="mode-btn active" data-mode="local">Local</button>
            <button class="mode-btn" data-mode="bot">Bot</button>
            <button class="mode-btn" data-mode="online">Online</button>
          </div>
          <div class="board-controls">
            <button class="small-btn" id="flipBtn"><i class="fa-solid fa-arrows-rotate"></i> Flip</button>
            <button class="small-btn" id="undoBtn"><i class="fa-solid fa-undo"></i> Undo</button>
          </div>
        </div>

        <div class="board-shell">
          <div class="board-wrap">
            <div id="board" aria-label="Chess board"></div>
          </div>
        </div>

        <div class="bottom-bar">
          <div class="status-pill">
            <span id="statusText">White to move</span>
            <span class="status-dot" id="statusDot"></span>
          </div>
        </div>
      </main>

      <aside class="sidebar">
        <section class="card">
          <div class="card-title">
            <span>Players</span>
            <span id="matchBadge">Local</span>
          </div>

          <div class="score-row">
            <div class="player-badge">
              <div class="avatar">W</div>
              <div>
                <div class="player-name">White</div>
                <div class="player-tag">Human</div>
              </div>
            </div>
            <div class="player-elo" id="whiteElo">1200</div>
          </div>

          <div class="score-row">
            <div class="player-badge">
              <div class="avatar dark">B</div>
              <div>
                <div class="player-name" id="blackName">Black</div>
                <div class="player-tag" id="blackType">Bot</div>
              </div>
            </div>
            <div class="player-elo" id="blackElo">1600</div>
          </div>
        </section>

        <section class="card">
          <div class="card-title">
            <span>Skill</span>
            <span>Rating</span>
          </div>
          <div class="elo-grid" id="eloGrid">
            <button class="elo-btn active" data-elo="100"><span class="tier">100</span>Bronze</button>
            <button class="elo-btn" data-elo="300"><span class="tier">300</span>Iron</button>
            <button class="elo-btn" data-elo="600"><span class="tier">600</span>Silver</button>
            <button class="elo-btn" data-elo="1000"><span class="tier">1000</span>Gold</button>
            <button class="elo-btn" data-elo="1500"><span class="tier">1500</span>Elite</button>
            <button class="elo-btn" data-elo="2000"><span class="tier">2000</span>Master</button>
            <button class="elo-btn" data-elo="2500"><span class="tier">2500</span>Grand</button>
            <button class="elo-btn" data-elo="3000"><span class="tier">3000</span>Legend</button>
            <button class="elo-btn" data-elo="HELL"><span class="tier">HELL</span>Rain</button>
          </div>
        </section>

        <section class="card">
          <div class="card-title">
            <span>Move List</span>
            <span id="moveCount">0</span>
          </div>
          <div class="move-list" id="moveList"></div>
        </section>

        <section class="card">
          <div class="card-title">
            <span>Online</span>
            <span>Room</span>
          </div>
          <div class="room-box">
            <div class="room-code" id="roomCode">RAIN-0001</div>
            <button class="button" id="copyBtn"><i class="fa-solid fa-copy"></i></button>
          </div>
        </section>
      </aside>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const moveListEl = document.getElementById('moveList');
    const statusTextEl = document.getElementById('statusText');
    const statusDotEl = document.getElementById('statusDot');
    const blackNameEl = document.getElementById('blackName');
    const blackTypeEl = document.getElementById('blackType');
    const blackEloEl = document.getElementById('blackElo');
    const whiteEloEl = document.getElementById('whiteElo');
    const matchBadgeEl = document.getElementById('matchBadge');
    const moveCountEl = document.getElementById('moveCount');
    const roomCodeEl = document.getElementById('roomCode');

    const MAX_HISTORY = 200;
    const pieceIcons = {
      w: {
        p: 'fa-chess-pawn',
        r: 'fa-chess-rook',
        n: 'fa-chess-knight',
        b: 'fa-chess-bishop',
        q: 'fa-chess-queen',
        k: 'fa-chess-king'
      },
      b: {
        p: 'fa-chess-pawn',
        r: 'fa-chess-rook',
        n: 'fa-chess-knight',
        b: 'fa-chess-bishop',
        q: 'fa-chess-queen',
        k: 'fa-chess-king'
      }
    };

    const boardLetters = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    const eloMap = {
      '100': 1,
      '300': 1,
      '600': 1,
      '1000': 2,
      '1500': 2,
      '2000': 3,
      '2500': 3,
      '3000': 4,
      'HELL': 5
    };

    const state = {
      game: new Chess(),
      selectedSquare: null,
      legalMoves: [],
      mode: 'local',
      difficulty: '100',
      isBotTurn: false,
      botColor: 'b',
      whiteElo: 1200,
      blackElo: 1600,
      roomName: 'RAIN-0001',
      onlineChannel: null,
      onlinePlayers: { white: 'You', black: 'Guest' },
      orientation: 'w',
      history: [],
      lastMove: null,
      isGameOver: false
    };

    function createRoomCode() {
      const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let code = 'RAIN-';
      for (let i = 0; i < 4; i++) {
        code += letters[Math.floor(Math.random() * letters.length)];
      }
      return code;
    }

    function init() {
      state.roomName = createRoomCode();
      roomCodeEl.textContent = state.roomName;
      setupOnlineChannel();
      bindControls();
      renderBoard();
      updateStatus();
      updateMoveList();
      setMode('local');
      setDifficulty('100');
      setBlackInfo();
    }

    function bindControls() {
      document.getElementById('newGameBtn').addEventListener('click', resetGame);
      document.getElementById('botBtn').addEventListener('click', () => {
        setMode('bot');
        setDifficulty('HELL');
      });
      document.getElementById('copyBtn').addEventListener('click', copyRoom);
      document.getElementById('flipBtn').addEventListener('click', () => {
        state.orientation = state.orientation === 'w' ? 'b' : 'w';
        renderBoard();
      });
      document.getElementById('undoBtn').addEventListener('click', undoMove);

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setMode(btn.dataset.mode);
        });
      });

      document.querySelectorAll('.elo-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          setDifficulty(btn.dataset.elo);
        });
      });
    }

    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      matchBadgeEl.textContent = mode === 'local' ? 'Local' : mode === 'bot' ? 'Bot' : 'Online';

      if (mode === 'bot') {
        state.botColor = 'b';
        blackNameEl.textContent = 'Rain Bot';
        blackTypeEl.textContent = 'Engine';
        blackEloEl.textContent = state.difficulty === 'HELL' ? 'INF' : String(state.difficulty);
        whiteEloEl.textContent = '1200';
      } else if (mode === 'online') {
        blackNameEl.textContent = 'Guest';
        blackTypeEl.textContent = 'Online';
        blackEloEl.textContent = '1400';
        whiteEloEl.textContent = '1200';
      } else {
        setBlackInfo();
      }

      resetGame();
    }

    function setDifficulty(level) {
      state.difficulty = level;
      document.querySelectorAll('.elo-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.elo === level);
      });

      if (state.mode === 'bot') {
        blackEloEl.textContent = (level === 'HELL') ? 'INF' : String(level);
      }
    }

    function setBlackInfo() {
      blackNameEl.textContent = 'Black';
      blackTypeEl.textContent = 'Bot';
      blackEloEl.textContent = state.difficulty === 'HELL' ? 'INF' : String(state.difficulty);
      whiteEloEl.textContent = '1200';
    }

    function resetGame() {
      state.game = new Chess();
      state.selectedSquare = null;
      state.legalMoves = [];
      state.isGameOver = false;
      state.history = [];
      state.lastMove = null;
      state.isBotTurn = false;
      renderBoard();
      updateStatus();
      updateMoveList();
      if (state.mode === 'online') {
        broadcastOnlineState();
      }
    }

    function undoMove() {
      if (state.history.length === 0) return;
      const last = state.history.pop();
      state.game.load(last.before);
      state.lastMove = last.beforeMove;
      state.isGameOver = false;
      renderBoard();
      updateStatus();
      updateMoveList();
      if (state.mode === 'online') broadcastOnlineState();
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      const board = state.game.board();
      const rowOrder = state.orientation === 'w' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];
      const colOrder = state.orientation === 'w' ? [0, 1, 2, 3, 4, 5, 6, 7] : [7, 6, 5, 4, 3, 2, 1, 0];

      for (let rIndex of rowOrder) {
        for (let cIndex of colOrder) {
          const sq = boardLetters[cIndex] + (8 - rIndex);
          const square = document.createElement('button');
          square.type = 'button';
          square.className = 'square ' + (((rIndex + cIndex) % 2 === 0) ? 'light' : 'dark');
          square.dataset.square = sq;

          if (state.selectedSquare === sq) square.classList.add('selected');
          if (state.lastMove && (state.lastMove.from === sq || state.lastMove.to === sq)) {
            square.classList.add('lastmove');
          }
          if (state.legalMoves.some(move => move.to === sq)) {
            const move = state.legalMoves.find(m => m.to === sq);
            if (move && move.flags.includes('c')) square.classList.add('capture');
            else square.classList.add('movable');
          }

          const piece = state.game.get(sq);
          if (piece) {
            const icon = document.createElement('span');
            icon.className = 'piece ' + (piece.color === 'w' ? 'white-piece' : 'black-piece');
            const i = document.createElement('i');
            i.className = 'fa-solid ' + pieceIcons[piece.color][piece.type];
            icon.appendChild(i);
            square.appendChild(icon);
          }

          square.addEventListener('click', () => handleSquareClick(sq));
          boardEl.appendChild(square);
        }
      }
    }

    function handleSquareClick(square) {
      if (state.isGameOver) return;
      const turn = state.game.turn();

      if (state.mode === 'bot' && turn === 'b') return;
      if (state.mode === 'online' && state.onlinePlayers.black !== 'You' && turn === 'b') return;

      const piece = state.game.get(square);
      const selected = state.selectedSquare;

      if (selected) {
        const move = state.legalMoves.find(m => m.to === square);
        if (move) {
          makeMove(move);
          return;
        }
      }

      if (piece && piece.color === turn) {
        state.selectedSquare = square;
        state.legalMoves = state.game.moves({ square, verbose: true });
        renderBoard();
      } else {
        state.selectedSquare = null;
        state.legalMoves = [];
        renderBoard();
      }
    }

    function makeMove(move) {
      const before = state.game.fen();
      const beforeMove = { from: move.from, to: move.to, san: move.san || '' };
      const result = state.game.move({
        from: move.from,
        to: move.to,
        promotion: 'q'
      });

      if (!result) return;

      state.selectedSquare = null;
      state.legalMoves = [];
      state.lastMove = { from: move.from, to: move.to };
      state.history.push({ before, beforeMove });
      if (state.history.length > MAX_HISTORY) state.history.shift();

      renderBoard();
      updateStatus();
      updateMoveList();

      if (state.mode === 'online') {
        broadcastOnlineState();
      }

      if (state.game.isGameOver()) {
        state.isGameOver = true;
        updateStatus();
        return;
      }

      if (state.mode === 'bot' && state.game.turn() === 'b') {
        window.setTimeout(() => botThink(), 350);
      }
    }

    function updateMoveList() {
      const history = state.game.history({ verbose: true });
      moveListEl.innerHTML = '';
      moveCountEl.textContent = String(history.length);

      for (let i = 0; i < history.length; i += 2) {
        const item = document.createElement('div');
        item.className = 'move-row';
        const moveNo = document.createElement('span');
        moveNo.textContent = String(i / 2 + 1) + '.';

        const whiteMove = document.createElement('span');
        whiteMove.innerHTML = '<strong>' + (history[i]?.san || '') + '</strong>';
        const blackMove = document.createElement('span');
        blackMove.innerHTML = '<strong>' + (history[i + 1]?.san || '') + '</strong>';

        item.appendChild(moveNo);
        item.appendChild(whiteMove);
        item.appendChild(blackMove);
        moveListEl.appendChild(item);
      }
    }

    function updateStatus() {
      const turn = state.game.turn();
      const stateText = state.game.isCheckmate()
        ? (turn === 'w' ? 'Black wins by checkmate' : 'White wins by checkmate')
        : state.game.isStalemate()
          ? 'Draw by stalemate'
          : state.game.isThreefoldRepetition()
            ? 'Draw by repetition'
            : state.game.isInsufficientMaterial()
              ? 'Draw by insufficient material'
              : state.game.isDraw()
                ? 'Draw'
                : (turn === 'w' ? 'White to move' : 'Black to move');

      statusTextEl.textContent = stateText;
      statusDotEl.style.background = turn === 'w' ? 'var(--accent-2)' : 'var(--warning)';
      statusDotEl.style.boxShadow = turn === 'w'
        ? '0 0 15px rgba(96,224,161,0.7)'
        : '0 0 15px rgba(255,202,94,0.7)';
    }

    function evaluateBoard(game) {
      const board = game.board();
      let score = 0;
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = board[row][col];
          if (!piece) continue;
          const value = pieceValues[piece.type] + (piece.type === 'p' ? centerControlBonus(row, col) : 0);
          const sign = piece.color === 'w' ? 1 : -1;
          score += sign * value;
          score += sign * mobilityValue(game, piece, row, col);
        }
      }
      return score;
    }

    function centerControlBonus(row, col) {
      const centerDist = Math.max(Math.abs(3.5 - row), Math.abs(3.5 - col));
      return Math.max(0, 12 - centerDist * 4);
    }

    function mobilityValue(game, piece, row, col) {
      if (!piece) return 0;
      const moves = game.moves({ square: boardLetters[col] + (8 - row), verbose: true });
      return moves.length * (piece.color === 'w' ? 1 : -1) * 2;
    }

    function getBotMove(level) {
      const moves = state.game.moves({ verbose: true });
      if (!moves.length) return null;

      const maxDepth = {
        '100': 1,
        '300': 1,
        '600': 2,
        '1000': 2,
        '1500': 2,
        '2000': 3,
        '2500': 3,
        '3000': 4,
        'HELL': 5
      };

      const depth = maxDepth[level] || 2;
      let bestScore = -Infinity;
      let chosen = null;
      const orderedMoves = moves
        .map(move => ({ move, score: heuristicMoveScore(move) }))
        .sort((a, b) => b.score - a.score);

      for (let entry of orderedMoves) {
        const { move } = entry;
        state.game.move({ from: move.from, to: move.to, promotion: 'q' });
        const score = minimax(state.game, depth - 1, -Infinity, Infinity, false);
        state.game.undo();

        if (score > bestScore || (score === bestScore && Math.random() < 0.25)) {
          bestScore = score;
          chosen = move;
        }
      }

      return chosen;
    }

    function minimax(game, depth, alpha, beta, isMaximizing) {
      if (depth === 0 || game.isGameOver()) {
        return evaluateBoard(game);
      }

      const moves = game.moves({ verbose: true });
      if (isMaximizing) {
        let maxEval = -Infinity;
        for (const move of moves) {
          game.move({ from: move.from, to: move.to, promotion: 'q' });
          const evalScore = minimax(game, depth - 1, alpha, beta, false);
          game.undo();
          maxEval = Math.max(maxEval, evalScore);
          alpha = Math.max(alpha, evalScore);
          if (beta <= alpha) break;
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (const move of moves) {
          game.move({ from: move.from, to: move.to, promotion: 'q' });
          const evalScore = minimax(game, depth - 1, alpha, beta, true);
          game.undo();
          minEval = Math.min(minEval, evalScore);
          beta = Math.min(beta, evalScore);
          if (beta <= alpha) break;
        }
        return minEval;
      }
    }

    function heuristicMoveScore(move) {
      let score = 0;
      const piece = state.game.get(move.from);
      const target = state.game.get(move.to);
      if (target) score += pieceValues[target.type] * 1.7;
      if (move.san) {
        if (move.san.includes('x')) score += 35;
        if (move.san.includes('+')) score += 50;
        if (move.san.includes('#')) score += 200;
      }
      if (piece && piece.type === 'p') score += (move.to[1] === '8' || move.to[1] === '1') ? 120 : 0;
      return score;
    }

    function botThink() {
      if (state.isGameOver || state.mode !== 'bot') return;
      const move = getBotMove(state.difficulty);
      if (!move) return;
      const result = state.game.move({ from: move.from, to: move.to, promotion: 'q' });
      if (!result) return;
      state.lastMove = { from: move.from, to: move.to };
      state.history.push({ before: result.fen ? state.game.fen() : '', beforeMove: move });
      renderBoard();
      updateStatus();
      updateMoveList();
      if (state.game.isGameOver()) {
        state.isGameOver = true;
        updateStatus();
      }
    }

    function setupOnlineChannel() {
      if ('BroadcastChannel' in window) {
        state.onlineChannel = new BroadcastChannel('rain-chess-room');
        state.onlineChannel.onmessage = (event) => {
          const payload = event.data;
          if (!payload || payload.room !== state.roomName) return;
          if (payload.fen) {
            const next = new Chess(payload.fen);
            state.game = next;
            renderBoard();
            updateStatus();
            updateMoveList();
          }
        };
      }
    }

    function broadcastOnlineState() {
      if (!state.onlineChannel) return;
      state.onlineChannel.postMessage({
        room: state.roomName,
        fen: state.game.fen()
      });
    }

    async function copyRoom() {
      try {
        await navigator.clipboard.writeText(state.roomName);
        roomCodeEl.textContent = 'COPIED';
        setTimeout(() => {
          roomCodeEl.textContent = state.roomName;
        }, 900);
      } catch (err) {
        roomCodeEl.textContent = 'ROOM READY';
      }
    }

    init();
  </script>
</body>
</html>
